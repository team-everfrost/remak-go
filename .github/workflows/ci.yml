name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
      - run: git diff --exit-code
      - run: npx --yes @redocly/cli@2.39.0 lint --config .redocly.yaml docs/openapi.yaml
      - run: python -m pip install cfn-lint==1.46.0 && cfn-lint infra/aws/core.yaml
      - run: docker run --rm -v "$PWD:/mnt:ro" koalaman/shellcheck:v0.11.0 db/legacy/run.sh deploy/backup.sh test/legacy-rehearsal.sh infra/ministack/init.sh
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go test -race ./...
      - run: docker compose up -d --wait postgres ministack
      - run: go run ./cmd/migrate up
      - run: go test -count=1 -tags=integration ./...
      - run: ./test/legacy-rehearsal.sh
