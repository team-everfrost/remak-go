name: remak

x-app: &app
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remak}
      POSTGRES_USER: ${POSTGRES_USER:-remak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remak} -d ${POSTGRES_DB:-remak}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    build:
      context: ..
      args:
        COMMAND: migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["up"]
    restart: "no"
    networks: [internal]

  api:
    <<: *app
    build:
      context: ..
      args:
        COMMAND: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    networks: [internal]

  worker:
    <<: *app
    build:
      context: ..
      args:
        COMMAND: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      REMAK_DOMAIN: ${REMAK_DOMAIN:?REMAK_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    networks: [internal]

networks:
  internal:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
